<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oscar's Projects</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --cream: #F5F0E8;
            --ink: #1A1714;
            --gold: #C5A55A;
            --wine: #722F37;
            --terracotta: #B85C38;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--cream);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--wine);
            opacity: 0.7;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 3rem;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: var(--gold);
            margin: 0 auto 3rem;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .project-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: white;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        box-shadow 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .project-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }

        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 1.5rem;
            text-align: left;
        }

        .card-tag {
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--terracotta);
            margin-bottom: 0.5rem;
        }

        .card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--ink);
        }

        .card-desc {
            font-size: 0.88rem;
            line-height: 1.6;
            color: #666;
            font-weight: 300;
        }

        .card-arrow {
            position: absolute;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
            transition: background 0.3s, transform 0.3s;
        }
        .project-card:hover .card-arrow {
            background: var(--terracotta);
            transform: translateX(3px);
        }

        /* Coming soon cards */
        .project-card.coming-soon {
            opacity: 0.5;
            pointer-events: none;
        }
        .project-card.coming-soon .card-image {
            filter: grayscale(0.6);
        }

        footer {
            margin-top: 4rem;
            font-size: 0.75rem;
            color: rgba(0,0,0,0.3);
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Projects</h1>
        <p class="subtitle">Interactive Explorations</p>
        <div class="divider"></div>

        <div class="projects">
            <a href="odyssey/" class="project-card">
                <img src="odyssey/images/hero-banner.jpg" alt="The Odyssey" class="card-image">
                <div class="card-body">
                    <div class="card-tag">Literature · Music · Art</div>
                    <h2 class="card-title">The Odyssey</h2>
                    <p class="card-desc">An interactive magazine exploring Homer's epic through 14 illustrated chapters, classical music, and deep pattern analysis.</p>
                </div>
                <div class="card-arrow">→</div>
            </a>

            <!-- Future projects go here -->
            <!--
            <a href="next-project/" class="project-card">
                <img src="next-project/images/cover.jpg" alt="Next Project" class="card-image">
                <div class="card-body">
                    <div class="card-tag">Category</div>
                    <h2 class="card-title">Next Project</h2>
                    <p class="card-desc">Description goes here.</p>
                </div>
                <div class="card-arrow">→</div>
            </a>
            -->
        </div>

        <footer>© 2026</footer>
    </div>
</body>
</html>
